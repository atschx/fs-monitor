name: CI

on:
  # Feature branches: only pull_request (avoids duplicate push+PR runs).
  # main: push after merge. Manual: workflow_dispatch.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS build, test, and package
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "runner=$(uname -m)"
          sw_vers
          xcodebuild -version
          swift --version
          date -u +%Y-%m-%dT%H:%M:%SZ

      - name: Package .app (includes swift test + release build)
        env:
          SHORT_VERSION: "0.1.0-test"
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: |
          chmod +x scripts/package-macos-app.sh
          /usr/bin/time -l bash scripts/package-macos-app.sh

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSMonitor-macos-app
          path: |
            dist/FSMonitor.app.zip
            dist/FSMonitor.app.sha256
            dist/BUILD_INFO.txt
            dist/codesign.txt
            dist/spctl.txt
          if-no-files-found: error
          retention-days: 14
