name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build guide.html from guide.md
        run: python3 docs/build_guide_html.py

      - name: Verify landing page files
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/guide.md
          test -f docs/guide.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/index.html").read_text(encoding="utf-8")
          guide = Path("docs/guide.html").read_text(encoding="utf-8")
          css = Path("docs/style.css").read_text(encoding="utf-8")
          assert 'lang="zh-CN"' in html
          assert "FSEvents" in html
          assert "100% 物理 IO" in html
          assert "v0.1.1-beta.1" in html
          assert "releases/tag/v0.1.1-beta.1" in html
          assert "e31843a4cbb1b1f5fc543ccd2cd561061487519efd18db1f97e8e29e5d7031e4" in html
          assert "f1b077f96e5c7244fe55bc42bb060d45e9e09769" in html
          assert "未公证" in html
          assert "Liquid Glass" in html
          assert "未验收" in html
          assert "负责人已跳过" not in html
          assert "需求仍开放" not in html
          assert "发布准备中" not in html
          assert 'id="team"' in html
          assert "Albert" in html
          assert "共同启动的第一个项目" in html
          assert "管家" in html
          assert "统筹协同与发布核验" in html
          for name in ("Nova", "Huluwa", "Cook", "Bob", "Eric"):
              assert name in html
          for path in (
              "docs/team/nova.png",
              "docs/team/huluwa.png",
              "docs/team/cook.png",
              "docs/team/bob.png",
              "docs/team/eric.png",
          ):
              assert Path(path).is_file(), path
          assert "team/nova.png" in html
          assert "team/huluwa.png" in html
          assert "team/cook.png" in html
          assert "team/bob.png" in html
          assert "team/eric.png" in html
          assert "alt=" in html
          assert "不等于实机验收通过" in html
          assert re.search(r"sqlite|fs_usage", html, re.I) is None
          assert "建立基线" in guide
          assert "Gatekeeper" in guide
          assert "负责人已跳过" not in guide
          assert "--sea:" in css
          assert ".team-grid" in css
          print("static checks ok")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
