name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build guide.html from guide.md
        run: python3 docs/build_guide_html.py

      - name: Verify landing page files
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/guide.md
          test -f docs/guide.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/index.html").read_text(encoding="utf-8")
          guide = Path("docs/guide.html").read_text(encoding="utf-8")
          css = Path("docs/style.css").read_text(encoding="utf-8")
          assert 'lang="zh-CN"' in html
          assert "FSEvents" in html
          assert "100% 物理 IO" in html
          assert "Releases" in html
          assert "早期 demo" in html
          assert re.search(r"sqlite|fs_usage", html, re.I) is None
          assert "建立基线" in guide
          assert "Gatekeeper" in guide
          assert "--sea:" in css
          print("static checks ok")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
